name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      # The Firestore and Storage emulators need Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run typecheck
      - run: npm run lint
      # Unit tests, including the speed budgets in packages/shared/src/__tests__/perf.test.ts.
      - run: npm test
      - run: npm run test:rules
      - name: Bundle size budget
        run: node scripts/check-bundle.mjs 5
